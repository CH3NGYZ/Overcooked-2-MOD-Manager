# RW 的 DIYLevel 地图。
#
# 一个作者的多个地图都放在这个文件里。新增地图时复制一段 [[maps]] 即可，
# 不需要改索引（maps.toml）。
#
# 字段说明（完整版见 docs/map-sources.md）：
#   level_set_name + author  绑定本地关卡集的身份，必须与 info 文件里的
#                            levelSetName / author 完全一致（忽略大小写）
#   asset_rules              选哪个 Release 资产，地图只分发 ZIP
#   relations                依赖的框架与最低版本
[[maps]]
enabled = true
# 仓库基本信息
name_i18n.zh-CN = "RW 关卡合集"
name_i18n.zh-TW = "RW 關卡合集"
name_i18n.en = "RW Level Pack"
name_i18n.ko = "RW 레벨 팩"
name_i18n.ja = "RW レベルパック"
group_i18n.zh-CN = "RW"
group_i18n.zh-TW = "RW"
group_i18n.en = "RW"
group_i18n.ko = "RW"
group_i18n.ja = "RW"
provider = "gitee"
username = "ch3ngyz"
repository = "DIYLevel-Maps-RW"
region = ""
platform = ""

# 下载方式
channel = "all"
max_release_count = 10
download_threads = 32

# 版本资产规则：该仓库的资产名为 rw_v0.73.zip 之类
asset_rules = [
  { type = "glob", value = "rw_v*.zip" },
]

# 本地关卡集识别绑定
# 这两个值来自 info 文件（levelSetName / author），装好后可在详情里核对
level_set_name = "RW_LevelSet"
author = "RW"

# 备注（鼠标悬停或详情里显示）
note_i18n.zh-CN = "包含 10 张由 RW 制作的自定义关卡，需要在设置里启用 DIYLevel 框架。"
note_i18n.zh-TW = "包含 10 張由 RW 製作的自訂關卡，需要在設定裡啟用 DIYLevel 框架。"
note_i18n.en = "Ten custom levels by RW. Requires the DIYLevel framework to be enabled in settings."
note_i18n.ko = "RW가 제작한 커스텀 레벨 10개. 설정에서 DIYLevel 프레임워크를 활성화해야 합니다."
note_i18n.ja = "RW 制作のカスタムレベル 10 種。設定で DIYLevel フレームワークを有効にする必要があります。"

# 运行前置：地图由 DIYLevel 读取，Web Runtime 提供联网能力
[[maps.relations]]
kind = "requires"
guid = "dev.gua.overcooked.diylevel"
min_version = "0.10.0"

[[maps.relations]]
kind = "requires"
guid = "oc2.oc2diylevelruntimewloader"
min_version = "3.10.2"
