셰프가 엎드리기, 눕기, 좌우로 눕기, 공중제비, 제자리 회전을 할 수 있습니다.
한 번의 클릭으로 물건을 던지거나 자신의 배낭에서 물건을 꺼낼 수 있습니다. 
- 구성 관리자에서 해당 기능을 활성화해야 합니다."""
note_i18n.zh-CN = """
动作：厨师的趴下、躺下、左躺、右躺，以及翻跟斗和原地旋转。
功能：一键抛物和一键从自身背包取物。
- 使用时，需要在配置管理器里面打开开关。"""
note_i18n.zh-TW = """
動作：廚師趴下、躺下、向左躺、向右躺、翻跟斗及原地旋轉。
功能：一鍵拋物及從自身背包取物。
- 使用時需要在設定管理器中開啟開關。"""

