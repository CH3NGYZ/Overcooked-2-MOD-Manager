name: Refresh four platform build caches
run-name: Refresh shared platform caches (${{ github.ref_name }})

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Build and Release']
    types: [completed]

permissions:
  contents: read

jobs:
  refresh:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.conclusion == 'success' &&
         startsWith(github.event.workflow_run.head_branch, 'v') &&
         github.event.workflow_run.head_repository.full_name == github.repository &&
         github.event.workflow_run.head_sha == github.sha))
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
          - platform: 'macos-15-intel'
            target: 'x86_64-apple-darwin'
    concurrency:
      group: oc2-main-build-cache-${{ matrix.target }}
      cancel-in-progress: false
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate the cache trigger and pinned main source
        run: node scripts/build-cache.mjs authorize
      - name: Check whether the shared snapshot is already current
        id: lookup
        uses: ./.github/actions/build-cache
        with:
          target: ${{ matrix.target }}
          lookup-only: true
      - uses: dtolnay/rust-toolchain@stable
        if: steps.lookup.outputs.cache-hit != 'true'
        with:
          targets: ${{ matrix.target }}
          components: rustfmt
      - name: Restore shared platform cache
        if: steps.lookup.outputs.cache-hit != 'true'
        id: cache
        uses: ./.github/actions/build-cache
        with:
          target: ${{ matrix.target }}
      - name: Install dependencies
        if: steps.lookup.outputs.cache-hit != 'true'
        run: npm ci
      - name: Regression tests and unsigned build (no installer, Release, or signing keys)
        if: steps.lookup.outputs.cache-hit != 'true'
        shell: bash
        env:
          CACHE_TARGET: ${{ matrix.target }}
        run: |
          mkdir -p src-tauri/target/verification/tmp
          export TEMP="$PWD/src-tauri/target/verification/tmp"
          export TMP="$TEMP"
          export TMPDIR="$TEMP"
          npm test
          npm run build
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo test --manifest-path src-tauri/Cargo.toml --lib --locked --jobs 1
          cargo build --manifest-path src-tauri/Cargo.toml --release --locked --jobs 1 --target "$CACHE_TARGET"
      - name: Create bounded npm and Cargo snapshot
        if: steps.lookup.outputs.cache-hit != 'true'
        shell: bash
        env:
          CACHE_TARGET: ${{ matrix.target }}
        run: node scripts/build-cache.mjs snapshot "$CACHE_TARGET"
      - name: Remove previous platform entry and legacy tag caches only after a successful build
        if: steps.lookup.outputs.cache-hit != 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CACHE_TARGET: ${{ matrix.target }}
        run: node scripts/build-cache.mjs replace "$CACHE_TARGET"
      - name: Save the single platform cache
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.cache.outputs.key }}
          path: ${{ steps.cache.outputs.path }}
      - name: Verify exactly one bounded main cache
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CACHE_TARGET: ${{ matrix.target }}
        run: node scripts/build-cache.mjs verify "$CACHE_TARGET"
