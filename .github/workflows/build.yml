name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: '--target x86_64-pc-windows-msvc'
            platform_name: 'Windows'
          - platform: 'ubuntu-22.04'
            args: '--target x86_64-unknown-linux-gnu'
            platform_name: 'Linux'
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            platform_name: 'macOS'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || matrix.platform == 'ubuntu-22.04' && 'x86_64-unknown-linux-gnu' || 'x86_64-pc-windows-msvc' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.platform }}
          cache-on-failure: true

      - name: Install frontend dependencies
        run: npm ci

      - name: Build with Tauri
        id: tauri_build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ''
          args: ${{ matrix.args }}

      - name: Create release if not exists
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_name }}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --title "Overcooked 2 MOD Manager $tag" \
              --notes "See the assets to download and install this version." \
              --draft
          fi

      - name: Rename and upload artifacts with platform name
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          platform="${{ matrix.platform_name }}"
          tag="${{ github.ref_name }}"

          cd src-tauri/target/release/bundle

          # Function to rename and upload
          upload_with_prefix() {
            local file="$1"
            [ -f "$file" ] || return
            local filename=$(basename "$file")
            local new_name="${platform}_${filename}"
            local dir=$(dirname "$file")

            # Copy with new name to avoid issues with in-place rename
            cp "$file" "$dir/$new_name"
            echo "Uploading: $new_name"
            gh release upload "$tag" "$dir/$new_name" --clobber
            rm "$dir/$new_name"
          }

          # Windows NSIS
          if [ -d "nsis" ]; then
            for file in nsis/*.exe; do
              upload_with_prefix "$file"
            done
          fi

          # Linux deb
          if [ -d "deb" ]; then
            for file in deb/*.deb; do
              upload_with_prefix "$file"
            done
          fi

          # Linux rpm
          if [ -d "rpm" ]; then
            for file in rpm/*.rpm; do
              upload_with_prefix "$file"
            done
          fi

          # Linux AppImage
          if [ -d "appimage" ]; then
            for file in appimage/*.AppImage; do
              upload_with_prefix "$file"
            done
          fi

          # macOS dmg
          if [ -d "dmg" ]; then
            for file in dmg/*.dmg; do
              upload_with_prefix "$file"
            done
          fi

          # macOS app tarball
          if [ -d "macos" ]; then
            for file in macos/*.tar.gz; do
              upload_with_prefix "$file"
            done
          fi
