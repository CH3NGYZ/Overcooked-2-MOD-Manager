level_set_name = "nono"
level_set_name_zh = "小no"
author = ""

note_i18n.zh-CN = "共 3 张关卡。需要 DIYLevel 框架。"
note_i18n.zh-TW = "共 3 張關卡。需要 DIYLevel 框架。"
note_i18n.en = "Three levels. Requires the DIYLevel framework."
note_i18n.ko = "레벨 3개. DIYLevel 프레임워크가 필요합니다."
note_i18n.ja = "レベル 3 種。DIYLevel フレームワークが必要です。"

[[maps.relations]]
kind = "requires"
