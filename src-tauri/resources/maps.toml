# 地图源索引：具体地图配置位于下方相对路径指向的子源文件。
#
# 结构与仓库源（repositories.toml）完全对称：
#   · 本文件只声明子源，不直接放地图条目；
#   · url 可以是完整 HTTPS 地址、内置资源名，或**相对本文件**的路径；
#   · [[map_sources]] 的顺序决定源在地图页的展示顺序。
#
# 一个作者一个子源文件：同一位老师的多张地图放在同一个 TOML 里，
# 这样新增地图不需要改索引。
[[map_sources]]
id = "maps-rw"
url = "maps-rw.toml"
builtin = true
[map_sources.nickname_i18n]
zh-CN = "RW - DIYLevel 地图"
zh-TW = "RW - DIYLevel 地圖"
en = "RW - DIYLevel maps"
ko = "RW - DIYLevel 지도"
ja = "RW - DIYLevel マップ"

# 第三方地图源：文档本身放在该仓库的 Release 资产里（tag `maps`）。
#
# 这种「文档进 Release 资产」的形态与普通子源有两点不同，都由后端处理：
#   · 加载前先向同一个仓库的 API 取该资产的 size/sha256，再竞速下载并校验
#     （没有校验信息时退回单次直连，校验是增强而不是新的失败点）；
#   · 文档里**不能再写相对子源** —— Release 资产地址会跳到签名 URL，相对
#     路径必然解析错，后端会直接报 `source.relativeChildInReleaseAsset`。
#
# `builtin = true` 与「是否为官方维护」无关：它在这里的含义是「内置快照里
# 登记过的源，开内置模式也要加载」。第三方源不登记就会被默认配置整条跳过。
[[map_sources]]
id = "qingyuqingxue-bundle"
url = "https://github.com/QingyuQingxue/OC2-Map-Bundle/releases/download/maps/map-sources.toml"
builtin = true
[map_sources.nickname_i18n]
zh-CN = "由清雨青雪维护的地图源，更新较慢请谅解"
zh-TW = "由清雨青雪維護的地圖源，更新較慢請諒解"
en = "Map source maintained by QingyuQingxue - updates are slower, thank you for understanding"
ko = "QingyuQingxue가 관리하는 지도 소스 - 업데이트가 느린 점 양해 부탁드립니다"
ja = "QingyuQingxue が管理するマップソース - 更新が遅めです、ご了承ください"
