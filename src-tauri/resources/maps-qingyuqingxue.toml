# info 里没写作者，所以 `author = ""` —— 绑定判定也按空串比对。分组名取作者
# 包目录里的署名 `小NO`（ZIP 内目录 `blni_v2.1(小NO)`），只是展示用，不影响绑定。
# ---------------------------------------------------------------------------
[[maps]]
enabled = true
name_i18n.zh-CN = "小no"
name_i18n.zh-TW = "小no"
name_i18n.en = "nono"
name_i18n.ko = "nono"
name_i18n.ja = "nono"
group_i18n.zh-CN = "小NO"
group_i18n.zh-TW = "小NO"
group_i18n.en = "小NO"
group_i18n.ko = "小NO"
group_i18n.ja = "小NO"

# blni_v2.1.zip → 版本 2.1
tag = "blni"
asset_rules = [
  { type = "regex", value = '^blni_v(?P<version>[0-9.]+)\.zip$' },
