[[repositories]]
# 仓库基本信息
name = "DIYLevel 快速载入"
name_i18n.zh-CN = "DIYLevel 快速载入"
name_i18n.zh-TW = "DIYLevel 快速載入"
name_i18n.en = "DIYLevel Fast Init"
name_i18n.ko = "DIYLevel 빠른 로딩"
provider = "github"
group = "性能优化"
group_i18n.zh-CN = "性能优化"
group_i18n.zh-TW = "效能優化"
group_i18n.en = "Performance Optimization"
group_i18n.ko = "성능 최적화"
username = "kfyangc"
repository = "Overcooked2-DIYLevelFastInit"
enabled = true

# 下载方式
download_mode = "release"

# Release 参数
channel = "all"
max_release_count = 10
download_threads = 32

# 版本资产规则
asset_rules = [
  { type = "exact", value = "DIYLevelFastInit.dll" },
]

# 本地 MOD 识别绑定
plugin_guid = "oc2.diylevel.fastinit"
local_product_name = "DIYLevelFastInit"
local_original_filename = "DIYLevelFastInit.dll"
version_regex = ""

# 安装目录
install_target = "BepInEx/plugins"

# 仓库备注
note = """优化 OC2DIYLevel 自定义关卡加载，避免进入主菜单时因大量关卡资源加载而长时间卡顿。

**主要功能：**
- **后台异步加载**：将大量关卡资源转为后台异步加载，避免主线程长时间冻结。
- **实时加载进度**：显示当前自定义关卡资源的加载进度。
- **热更新地图**：游戏运行时往 `Levels` 文件夹复制关卡文件可以实时加载。
- **避免重复加载**：自动跳过已经加载的资源，防止重复读档时再次完整加载。
- **兼容已加载资源**：检测已经加载的 common 资源，减少不必要的重复读取。
- **自动刷新关卡列表**：资源加载完成后自动更新「更多关卡」列表，确保新增关卡正常显示。
- **加载超时回退**：异步加载超时后自动回退到原版同步加载方式。
- **保持关卡顺序**：后台加载过程中保持原有的关卡集排列顺序。
"""
