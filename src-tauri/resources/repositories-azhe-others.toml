note = """
动作：厨师的趴下、躺下、左躺、右躺，以及翻跟斗和原地旋转。
功能：一键抛物和一键从自身背包取物。
- 使用时，需要在配置管理器里面打开开关。
"""
note_i18n.en = """
Chef actions include crouching, lying down, rolling, and spinning.
Also provides one-click throwing and taking items from your backpack. 
- Enable these features in the Configuration Manager."""
