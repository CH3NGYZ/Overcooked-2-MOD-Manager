[package]
name = "app"
version = "2.0.4"
description = "Overcooked2 MOD Manager"
authors = ["GitHub@CH3NGYZ"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = ["devtools"] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
] }
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "sync", "time", "fs", "io-util"] }
toml = "0.8"
semver = { version = "1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
zip = "2.2"
walkdir = "2"
same-file = "1"
# 地图目录可能被资源管理器直接改（增删集目录、替换 info）：轮询大目录太贵，
# 用系统的目录变更通知（Windows ReadDirectoryChangesW / macOS FSEvents）。
notify = "8"
# DIYLevel 的 info 文件是 Unity AssetBundle（UnityFS），关卡集名/作者/版本
# 只能从里面解析。SerializedFile 与类型树交给 unityfs（UnityPy 的 Rust 移植）。
#
# 容器（UnityFS 头部 + 块表）仍自己解：unityfs 的数据块解压缺 LZMA 分支，
# 而这份资源恰恰用 LZMA 压缩数据块，用它会把压缩数据当原始数据。
unityfs = "0.1"
image = { version = "0.25", default-features = false, features = ["png"] }
lz4_flex = { version = "0.11", default-features = false, features = ["std"] }
regex = "1"
scraper = { version = "0.27", default-features = false }
globset = "0.4"
sysinfo = "0.30"
dirs = "6"
uuid = { version = "1", features = ["v4", "serde"] }
arboard = "3"
base64 = "0.22"
minisign-verify = "0.2.5"
url = "2"
thiserror = "2"
xz2 = { version = "0.1.7", features = ["static"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
winapi = { version = "0.3", features = [
    "combaseapi",
    "dpapi",
    "minwindef",
    "objbase",
    "shellapi",
    "shlobj",
    "securitybaseapi",
    "shtypes",
    "winbase",
    "winerror",
    "processthreadsapi",
    "winuser",
    "winver",
    "winnls",
] }
